<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
 body{
     width: 100%;
     height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgb(83, 83, 252);
   
 }   
 .container{
    width: 500px;
    height: 250px;
    background-color: blue;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
       box-shadow: 0px 0px 25px 20px rgb(38, 38, 154);  
 }
 #display{
    width: 250px;
    height: 30px;
    margin: 10px;
    text-align: center;
    font-size: 20px;
    border-radius: 30px ;
    border-style: none;
    font-size: 15px;
    
 }
 .submit{
    width: 80px;
    height: 30px;
    font-size: 15px;
    cursor: pointer;
    font-family:Arial, Helvetica, sans-serif;
    position:relative;
    right: 140px;
    top: 10px;
    border-radius: 8px;
    border-style: none;
    background-color:tomato ;
    color: white;
 }
.header{
    color: white;
    font-size: 25px;
    font-family:Arial, Helvetica, sans-serif;
    font-weight: bolder;
     position:relative;
    bottom: 30px;
    
}
.subcontainer{
    display: flex;
    width:310px ;
    height: 40px;
    border-radius: 40px;
    align-items: center;
    background-color: tomato;
     border-style: none;
     font-size: 4px;
     position: relative;
    bottom: 30px;
}
.copyy{
    width: 30px;
    height: 30px;
    align-items: center;
    justify-content: center;
    background-image:url();
    border-radius: 30px;
    border-style: none;

    
}
</style>
<body>
    
<div class="container">
    <p class="header">PASSWORD GENERATOR</p>
       
    <div class="subcontainer">
       <input type="text" id="display" value="" placeholder="Secure passcodes">

       <button class="copyy" onclick="copy()">C</button>
    </div>
     <button class="submit" type="submit" onclick="generate()">generate</button>
</div>
<script src="PASSWORDGEN.js">

</script>



</body>
</html>
